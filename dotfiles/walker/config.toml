# Walker — macOS Spotlight-style global search
# Theme CSS follows mocha/latte via colors/current.css (pkill walker after theme flip)

theme = "spotlight"
force_keyboard_focus = true
close_when_open = true
click_to_close = true
selection_wrap = true
hide_quick_activation = true

[placeholders]
"default" = { input = "Spotlight Search", list = "No Results" }

[providers]
default = ["desktopapplications", "calc", "runner"]
empty = ["desktopapplications", "clipboard"]
max_results = 12

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"
