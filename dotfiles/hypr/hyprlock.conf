# hyprlock — Catppuccin Mocha lock screen
# Colors: same palette as colors/mocha.css / waybar glass

general {
	disable_loading_bar = true
	hide_cursor = true
	no_fade_in = false
}

background {
	monitor =
	path = screenshot
.blur_passes = 3
	blur_size = 8
	noise = 0.015
	contrast = 0.9
	brightness = 0.75
	vibrancy = 0.2
	vibrancy_darkness = 0.2
}

label {
	monitor =
	text = $TIME
	font_size = 96
	font_family = JetBrainsMono Nerd Font
	color = rgba(cdd6f4ee)
	position = 0, 80
	halign = center
	valign = center
}

label {
	monitor =
	text = cmd[update:1000] echo "$(date '+%A, %m月%d日')"
	font_size = 18
	font_family = JetBrainsMono Nerd Font
	color = rgba(bac2decc)
	position = 0, 10
	halign = center
	valign = center
}

label {
	monitor =
	text = $USER
	font_size = 14
	font_family = JetBrainsMono Nerd Font
	color = rgba(a6adc8bb)
	position = 0, -60
	halign = center
	valign = center
}

input-field {
	monitor =
	size = 280, 48
	outline_thickness = 2
	dots_size = 0.25
	dots_spacing = 0.35
	dots_center = true
	outer_color = rgba(cba6f7cc)
	inner_color = rgba(1e1e2eff)
	font_color = rgba(cdd6f4ff)
	fade_on_empty = false
	placeholder_text = <i>输入密码…</i>
	fail_text = <i>验证失败（$FAIL）</i>
	caps_lock_color = rgba(f9e2afaa)
	position = 0, -140
	halign = center
	valign = center
}
